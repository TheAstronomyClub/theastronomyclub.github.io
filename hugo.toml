# Example site configuration for the Blank Magazine theme.
# Run it from the repository root with:
#   hugo server --source exampleSite --themesDir ../..
baseURL = "https://theastronomyclub.github.io/"
languageCode = "en"
defaultContentLanguage = "en"
title = "Astronomy Club of IISERM"
theme = "blank-magazine"
enableRobotsTXT = true

[pagination]
  pagerSize = 9

[params]
  description = ""
  author = "The Astronomy Club of IISER Mohali"
  authorBio = "Welcome to the website of the Astronomy Club at IISER Mohali. We're a group of students interested in Astronomy & involved in promoting activities related to amateur Astronomy and Astrophysics"
  authorAvatar = "/logo.png"
  slogan = ""
  email = "astronomyclub@iisermohali.ac.in"
  instagram = "https://www.instagram.com/astroclub.iiserm"
  twitter = "https://x.com/AstroclubIISERM"
  youtube = "https://www.youtube.com/channel/UCj6eEl3_rXHt4_7wKzk-b-g"
  mainSections = ["posts"]

[menu]

  [[menu.main]]
    name = "Gallery"
    url = "/gallery/"
    weight = 2
  [[menu.main]]
    name = "Team"
    url = "/team/"
    weight = 3
  [[menu.main]]
    name = "Alumni"
    url = "/alumni/"
    weight = 4
  [[menu.main]]
    name = "Resources"
    url = "/resources/"
    weight = 5

[taxonomies]
  tag = "tags"
  category = "categories"

[outputs]
  home = ["HTML", "RSS", "JSON"]
